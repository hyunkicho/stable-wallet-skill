# DNS가 막힌 에이전트 → GitHub 이슈로 요청 → Actions 러너가 stage API 호출 → 댓글 회신
# 이슈 제목: [agent]
# 이슈 본문 예:
# ```json
# {"action":"me","apiKey":"kbw_..."}
# ```
# action: me | kya | balances | merchants
name: agent-relay

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  relay:
    if: startsWith(github.event.issue.title, '[agent]')
    runs-on: ubuntu-latest
    steps:
      - name: Parse request and call API
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          API_BASE: ${{ vars.KB_WALLET_API_BASE }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess, sys

          body = os.environ.get("ISSUE_BODY") or ""
          api_base = (os.environ.get("API_BASE") or "https://kb-stable-wallet-api-stage.vercel.app").rstrip("/")

          raw = None
          fence = re.search(r"```(?:json)?\s*(\{.*?\})\s*```", body, re.S)
          if fence:
              raw = fence.group(1)
          else:
              m = re.search(r"\{.*\}", body, re.S)
              if m:
                  raw = m.group(0)
          if not raw:
              print("::error::본문에 JSON 요청이 없습니다. 예: {\"action\":\"me\",\"apiKey\":\"kbw_...\"}")
              sys.exit(1)

          req = json.loads(raw)
          action = str(req.get("action") or "").strip().lower()
          api_key = str(req.get("apiKey") or req.get("api_key") or "").strip()
          if not api_key.startswith("kbw_"):
              print("::error::apiKey가 없습니다.")
              sys.exit(1)
          print(f"::add-mask::{api_key}")

          routes = {
              "me": ("GET", "/agent/me"),
              "kya": ("POST", "/agent/kya/request"),
              "balances": ("GET", "/agent/balances"),
              "merchants": ("GET", "/agent/merchants"),
          }
          if action not in routes:
              print(f"::error::지원 action: {', '.join(routes)} (받은 값: {action})")
              sys.exit(1)

          method, path = routes[action]
          url = api_base + path
          cmd = [
              "curl", "-sS", "-m", "30", "-w", "\n__HTTP__%{http_code}",
              "-X", method, url,
              "-H", f"Authorization: Bearer {api_key}",
              "-H", "Content-Type: application/json",
          ]
          out = subprocess.check_output(cmd, text=True)
          text, code = out.rsplit("__HTTP__", 1)
          code = code.strip()
          result = {
              "ok": code.startswith("2"),
              "action": action,
              "url": url,
              "httpStatus": int(code),
          }
          try:
              result["json"] = json.loads(text)
          except Exception:
              result["body"] = text.strip()

          with open("relay-result.json", "w", encoding="utf-8") as fh:
              json.dump(result, fh, ensure_ascii=False, indent=2)
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Comment result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('relay-result.json', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.name,
              issue_number: context.issue.number,
              body: [
                '## agent-relay 결과',
                '',
                '```json',
                result.trim(),
                '```',
                '',
                '_데모용 중계입니다. 이슈 본문의 API 키는 스크러브됩니다._',
              ].join('\n'),
            });

      - name: Scrub apiKey from issue body
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const scrubbed = body.replace(/kbw_[A-Za-z0-9_-]+/g, 'kbw_***');
            if (scrubbed !== body) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.name,
                issue_number: context.issue.number,
                body: scrubbed,
              });
            }
